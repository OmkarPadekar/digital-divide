<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — Digital Divide</title>
  <meta name="description" content="Sign in to save your community profiles and continue exploring the digital divide.">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body data-page="login">
  <div id="site-nav"></div>
  <main class="auth-main"><section class="auth-card"><div class="auth-mark">DD</div><div class="eyebrow">Your workspace</div><h1>Keep exploring.</h1><p>Sign in to save your profiles and pick up where you left off.</p><form id="login-form"><label>Email address<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></label><label>Password<input id="password" type="password" placeholder="At least 6 characters" minlength="6" autocomplete="current-password" required></label><button class="button button-dark button-full" type="submit">Continue <span aria-hidden="true">→</span></button><p class="form-message" id="form-message" role="status"></p></form><div class="auth-divider"><span>or</span></div><button class="button button-outline button-full" type="button" id="continue-guest">Continue without an account</button></section></main>
  <div id="site-footer"></div>
  <script src="app.js?v=3"></script>
</body>
</html>
