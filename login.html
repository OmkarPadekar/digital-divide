<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — Digital Divide</title>
  <meta name="description" content="Sign in to continue exploring the digital divide.">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body data-page="login">
  <div id="site-nav"></div>
  <main class="auth-main"><section class="auth-card"><div class="auth-mark">DD</div><div class="eyebrow">Sign in</div><h1>Keep exploring.</h1><p>Enter your details to continue.</p><div class="auth-switch" role="group" aria-label="Choose sign-in method"><button type="button" class="active" data-mode="email">Email</button><button type="button" data-mode="phone">Phone</button></div><form id="login-form"><label id="identity-label">Email address<input id="identity" type="email" placeholder="you@example.com" autocomplete="email" required></label><label>Password<input id="password" type="password" placeholder="Enter your password" minlength="4" autocomplete="current-password" required></label><button class="button button-dark button-full" type="submit">Continue <span aria-hidden="true">→</span></button><p class="form-message" id="form-message" role="status"></p></form></section></main>
  <div id="site-footer"></div>
  <script src="app.js?v=8"></script>
</body>
</html>
